<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — Rahul Hospital</title>
  <meta name="description" content="Login to your Rahul Hospital patient account." />
  <link rel="icon" href="logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body data-page="login">
  <div id="site-header"></div>

  <section class="auth">
    <div class="container" style="max-width:520px">
      <div class="form-wrap reveal">
        <h2>Welcome back 👋</h2>
        <p class="sub">Login to manage your appointments and records</p>
        <form data-form="login" novalidate>
          <div class="alert ok"></div>
          <div class="alert err"></div>
          <div class="field"><label>Email</label><input type="email" name="email" required /></div>
          <div class="field"><label>Password</label><input type="password" name="password" required minlength="6" />
          </div>
          <button class="btn btn-primary" style="width:100%">Login</button>
          <p class="form-note">New here? <a href="register.html">Create an account</a></p>
        </form>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="script.js"></script>
</body>

</html>
