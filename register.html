<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Register — Rahul Hospital</title>
  <meta name="description" content="Create your Rahul Hospital patient account." />
  <link rel="icon" href="logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body data-page="register">
  <div id="site-header"></div>

  <section class="auth">
    <div class="container" style="max-width:560px">
      <div class="form-wrap reveal">
        <h2>Create your account</h2>
        <p class="sub">Join Rahul Hospital's patient portal</p>
        <form data-form="register" novalidate>
          <div class="alert ok"></div>
          <div class="alert err"></div>
          <div class="field"><label>Full Name</label><input name="name" required /></div>
          <div class="field"><label>Email</label><input type="email" name="email" required /></div>
          <div class="form-row">
            <div class="field"><label>Password</label><input type="password" name="password" required minlength="6" />
            </div>
            <div class="field"><label>Confirm Password</label><input type="password" name="confirm" required
                minlength="6" /></div>
          </div>
          <button class="btn btn-primary" style="width:100%">Create Account</button>
          <p class="form-note">Already have an account? <a href="login.html">Login</a></p>
        </form>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="script.js"></script>
</body>

</html>
